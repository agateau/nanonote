name: main

on:
  pull_request:
  # `workflow_call` is used by the tag workflow to trigger the `build` job
  workflow_call:
  workflow_dispatch:

jobs:
  check-codingstyle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: ci/install-clang-format
      - name: check coding style
        run: CLANG_FORMAT_CMD=./clang-format ci/check-codingstyle

  build:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUNBUFFERED: 1
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15-intel
          - windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: ci/install-dependencies deps
        shell: bash
      - name: Env vars
        run: cat deps/env.sh
        shell: bash
      - name: Build
        run: . deps/env.sh && ci/build-app
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: build/nanonote[-_]*.*
